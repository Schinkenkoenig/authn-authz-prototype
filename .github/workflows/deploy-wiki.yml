name: Deploy wiki to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'src/wiki/**'
      - '.github/workflows/deploy-wiki.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/wiki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/wiki/package-lock.json
      - run: npm ci
      # rehype-mermaid renders mermaid blocks to SVG at build time via a headless browser
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/wiki/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
